name: BIST MaT-R Güncelleme

on:
  schedule:
    - cron: "30 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matr-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: MaT-R verilerini oluştur
        run: |
          python matr.py

      - name: data.json kontrol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              raise SystemExit("HATA: data.json oluşturulmadı.")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("HATA: data.json liste değil.")

          if len(data) < 400:
              raise SystemExit(
                  f"HATA: Beklenenden az hisse bulundu: {len(data)}"
              )

          print(f"MaT-R başarılı: {len(data)} hisse")
          PY

      - name: Git değişikliklerini kontrol et
        run: |
          git status --short

      - name: Veriyi GitHub'a kaydet
        run: |
          git config user.name "MaT-R Bot"
          git config user.email "matr-bot@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Yeni veri değişikliği yok."
            exit 0
          fi

          git commit -m "MaT-R BIST verilerini güncelle"

          git push origin HEAD
